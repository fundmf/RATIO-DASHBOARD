name: Update AI Watchlist (Weekly)

# Runs on Saturday 02:00 UTC — that's:
#   Friday 10:00pm ET (6h after the 4pm market close on EDT)
#   Friday  9:00pm ET (5h after the 4pm market close on EST)
# Yahoo Finance has the official Friday close available by then.
#
# Also runs Sunday + Monday at 02:00 UTC as redundancy in case Saturday's
# runner is unavailable or yfinance returns nothing. The script is
# idempotent — if the latest Friday is already in ai_watchlist.json,
# the second and third runs are no-ops.

on:
  schedule:
    - cron: '0 2 * * 6'   # Saturday 02:00 UTC (primary)
    - cron: '0 2 * * 0'   # Sunday 02:00 UTC   (backup)
    - cron: '0 2 * * 1'   # Monday 02:00 UTC   (backup)
  workflow_dispatch:       # manual trigger from Actions tab

jobs:
  update-ai-watchlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance requests

      - name: Run AI watchlist updater
        run: python update_ai_watchlist.py

      - name: Commit updated data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add ai_watchlist.json
          git diff --staged --quiet && exit 0
          git commit -m "AI watchlist: $(date -u '+%Y-%m-%d') weekly close"
          ok=0
          for i in 1 2 3 4 5; do
            if git push origin main; then ok=1; break; fi
            echo "Push attempt $i failed — rebasing on remote and retrying..."
            git pull --rebase --autostash origin main || true
            sleep $((i * 5))
          done
          [ "$ok" = "1" ] || { echo "Push failed after 5 attempts"; exit 1; }
